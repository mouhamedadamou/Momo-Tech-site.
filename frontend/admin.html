<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace admin — Momo Tech</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">

  <!-- ===== LOGIN ===== -->
  <div id="admin-login-view">
    <div class="login-wrap">
      <div class="login-card">
        <h1>Espace admin</h1>
        <p>Momo Tech — accès réservé.</p>
        <form id="admin-login-form">
          <p id="admin-login-error"></p>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>
          </div>
          <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" name="password" id="password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ===== DASHBOARD ===== -->
  <div id="admin-dashboard-view" style="display:none;">
    <div class="admin-topbar">
      <div class="logo"><span class="logo-mark">MT</span> Momo Tech — Admin</div>
      <button class="btn btn-outline" id="admin-logout-btn">Déconnexion</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><b id="stat-total">—</b><span>Commandes totales</span></div>
      <div class="stat-card"><b id="stat-paid">—</b><span>Commandes payées</span></div>
      <div class="stat-card"><b id="stat-pending">—</b><span>En attente</span></div>
      <div class="stat-card"><b id="stat-revenue">—</b><span>Chiffre d'affaires</span></div>
      <div class="stat-card"><b id="stat-today">—</b><span>Commandes du jour</span></div>
    </div>

    <form class="admin-toolbar" id="admin-search-form">
      <input type="text" id="admin-search" placeholder="Rechercher : n° commande, ID Free Fire, téléphone, e-mail">
      <select id="admin-status-filter">
        <option value="">Tous les statuts de paiement</option>
        <option value="PENDING">En attente</option>
        <option value="COMPLETED">Payé</option>
        <option value="FAILED">Échoué</option>
        <option value="CANCELLED">Annulé</option>
      </select>
      <button type="submit" class="btn btn-primary">Rechercher</button>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>N° commande</th>
            <th>Date</th>
            <th>Client</th>
            <th>ID Free Fire</th>
            <th>Produit</th>
            <th>Prix</th>
            <th>Paiement</th>
            <th>Traitement</th>
          </tr>
        </thead>
        <tbody id="orders-table-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
